server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sledaa?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Configuration (10GB limit)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10737418240
spring.servlet.multipart.max-request-size=10737418240
spring.http.multipart.enabled=true
spring.http.multipart.max-file-size=10737418240
spring.http.multipart.max-request-size=10737418240
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=10737418240
server.tomcat.max-http-post-size=10737418240

# Gemini AI Configuration
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# JWT Configuration (Expiration time in milliseconds)
# Normal login: 86400000 = 24 hours
sledaa.app.jwtExpirationMs=86400000
# Remember Me: 2592000000 = 30 days
sledaa.app.jwtExpirationMsRememberMe=2592000000
